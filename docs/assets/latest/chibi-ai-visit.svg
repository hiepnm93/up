<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Chibi đứng ngắm màn hình trưng bày AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3ecff"/>
      <stop offset="1" stop-color="#efe3ff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b6cff"/>
      <stop offset="1" stop-color="#9a5bff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect y="500" width="800" height="100" fill="#d4dcf5"/>

  <!-- display screen -->
  <rect x="330" y="70" width="420" height="300" rx="22" fill="#2b2f4a"/>
  <rect x="348" y="88" width="384" height="264" rx="14" fill="url(#screen)"/>
  <rect x="520" y="370" width="40" height="80" fill="#2b2f4a"/>
  <rect x="470" y="445" width="140" height="18" rx="9" fill="#2b2f4a"/>
  <!-- robot on screen -->
  <line x1="540" y1="140" x2="540" y2="118" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <circle cx="540" cy="112" r="10" fill="#ffe08a"/>
  <rect x="465" y="140" width="150" height="120" rx="30" fill="#fff"/>
  <circle cx="510" cy="195" r="16" fill="#5b6cff"/>
  <circle cx="570" cy="195" r="16" fill="#5b6cff"/>
  <circle cx="515" cy="190" r="5" fill="#fff"/>
  <circle cx="575" cy="190" r="5" fill="#fff"/>
  <path d="M520 230 Q540 245 560 230" stroke="#5b6cff" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- chat bubbles -->
  <rect x="380" y="285" width="120" height="34" rx="17" fill="#fff" opacity="0.9"/>
  <rect x="580" y="285" width="130" height="34" rx="17" fill="#ffe08a" opacity="0.95"/>
  <g fill="#9a5bff"><circle cx="410" cy="302" r="5"/><circle cx="440" cy="302" r="5"/><circle cx="470" cy="302" r="5"/></g>
  <text x="645" y="309" font-family="sans-serif" font-size="20" font-weight="700" fill="#5b3ec8" text-anchor="middle">AI</text>

  <!-- chibi (viewer) -->
  <!-- body -->
  <path d="M120 420 Q190 385 260 420 L272 520 Q190 538 108 520Z" fill="#ff8a65"/>
  <rect x="140" y="515" width="34" height="45" rx="14" fill="#3b4a7a"/>
  <rect x="206" y="515" width="34" height="45" rx="14" fill="#3b4a7a"/>
  <ellipse cx="155" cy="562" rx="27" ry="13" fill="#fff"/>
  <ellipse cx="223" cy="562" rx="27" ry="13" fill="#fff"/>
  <!-- pointing arm -->
  <path d="M250 440 Q300 410 330 380" stroke="#ff8a65" stroke-width="30" stroke-linecap="round" fill="none"/>
  <circle cx="334" cy="376" r="17" fill="#ffd9c0"/>
  <!-- other arm -->
  <ellipse cx="128" cy="470" rx="17" ry="20" fill="#ffd9c0"/>
  <!-- head -->
  <circle cx="190" cy="300" r="112" fill="#ffd9c0"/>
  <path d="M78 300 Q72 180 190 175 Q308 180 302 300 Q292 245 248 232 Q220 262 165 245 Q125 258 105 236 Q82 262 78 300Z" fill="#2f2a3a"/>
  <!-- glasses -->
  <circle cx="155" cy="312" r="28" fill="#fff" fill-opacity="0.35" stroke="#2f2a3a" stroke-width="6"/>
  <circle cx="232" cy="312" r="28" fill="#fff" fill-opacity="0.35" stroke="#2f2a3a" stroke-width="6"/>
  <line x1="183" y1="312" x2="204" y2="312" stroke="#2f2a3a" stroke-width="6"/>
  <!-- eyes looking right/up -->
  <ellipse cx="162" cy="308" rx="11" ry="15" fill="#2f2a3a"/>
  <ellipse cx="239" cy="308" rx="11" ry="15" fill="#2f2a3a"/>
  <circle cx="166" cy="302" r="4" fill="#fff"/>
  <circle cx="243" cy="302" r="4" fill="#fff"/>
  <ellipse cx="128" cy="355" rx="18" ry="9" fill="#ff9fb0" opacity="0.7"/>
  <ellipse cx="262" cy="355" rx="18" ry="9" fill="#ff9fb0" opacity="0.7"/>
  <ellipse cx="196" cy="362" rx="12" ry="10" fill="#c0504d"/>
  <!-- curiosity marks -->
  <g stroke="#5b6cff" stroke-width="6" stroke-linecap="round">
    <line x1="290" y1="190" x2="310" y2="170"/>
    <line x1="305" y1="215" x2="332" y2="208"/>
    <line x1="270" y1="175" x2="276" y2="150"/>
  </g>
</svg>
